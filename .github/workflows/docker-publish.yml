name: docker-publish

# Builds the default PHP image (php8.4/apache) natively on amd64 and arm64, runs the
# DAMP smoke test (bin/test.sh) against each, and on master pushes / manual runs on
# master pushes yousan/php8.4-apache:latest and :<PHP version> to Docker Hub.
# The legacy php5.6 / php7.2 images and yousan/dnsmasq are not touched.

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so :latest picks up PHP / Debian security releases.
    - cron: '41 4 * * 2'
  pull_request:
    paths:
      - php8.4/apache/**
      - docker-compose.yml
      - bin/test.sh
      - .github/workflows/docker-publish.yml
      - .github/compose.ci.yml

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: yousan/php8.4-apache
  CONTEXT: php8.4/apache

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      # dnsmasq on 127.0.0.1:53 only; see .github/compose.ci.yml.
      COMPOSE_FILE: docker-compose.yml:.github/compose.ci.yml
      # Only master (push, manual run or schedule on master) may overwrite :latest.
      PUSH_EVENT: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # yousan/dnsmasq is amd64-only. Docker Desktop on Apple silicon runs it emulated;
      # do the same here so the arm64 stack is tested the way Mac users run it.
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'

      - name: Smoke test with the built image (docker-compose.yml, no rebuild)
        run: |
          mkdir -p ~/public_html
          echo 'listening on :53 before the test:'
          sudo ss -Hlntup 'sport = :53' || true
          docker compose pull phpmyadmin.test mysql.test dnsmasq.test
          # Use the image built above, never the one on Docker Hub.
          docker compose up -d --no-build --pull never
          echo "machine: $(docker exec php.test uname -m)"
          bin/test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down || true

      - name: PHP version
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm "$IMAGE:latest" php -r 'echo PHP_VERSION;' > "$RUNNER_TEMP/out/version"
          echo "PHP $(cat "$RUNNER_TEMP/out/version")"

      - name: Skip push
        if: env.PUSH_EVENT == 'true' && env.HAS_DOCKERHUB_SECRETS != 'true'
        run: echo "::notice title=Docker Hub push skipped::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not set. The image was built and tested but not pushed."

      - uses: docker/login-action@v3
        if: env.PUSH_EVENT == 'true' && env.HAS_DOCKERHUB_SECRETS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same build (served from the cache above), pushed by digest only; tags are added in the merge job.
      - name: Push ${{ matrix.platform }} by digest
        id: push
        if: env.PUSH_EVENT == 'true' && env.HAS_DOCKERHUB_SECRETS == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check the pushed digest is the tested image
        if: env.PUSH_EVENT == 'true' && env.HAS_DOCKERHUB_SECRETS == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Compare filesystem layers (the config may differ only in its timestamp).
          tested=$(docker image inspect "$IMAGE:latest" --format '{{json .RootFS.Layers}}')
          docker pull --quiet "$IMAGE@$DIGEST" >/dev/null
          pushed=$(docker image inspect "$IMAGE@$DIGEST" --format '{{json .RootFS.Layers}}')
          [ "$tested" = "$pushed" ] || { echo "pushed layers differ from the tested image"; exit 1; }
          echo "pushed $DIGEST (same layers as the tested image)"
          echo "$DIGEST" > "$RUNNER_TEMP/out/digest"

      - uses: actions/upload-artifact@v4
        if: env.PUSH_EVENT == 'true' && env.HAS_DOCKERHUB_SECRETS == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    env:
      HAS_DOCKERHUB_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Skip push
        if: env.HAS_DOCKERHUB_SECRETS != 'true'
        run: echo "::notice title=Docker Hub push skipped::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not set."

      - uses: actions/download-artifact@v4
        if: env.HAS_DOCKERHUB_SECRETS == 'true'
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      - name: Same PHP version on both platforms
        if: env.HAS_DOCKERHUB_SECRETS == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          v_amd64=$(cat digest-amd64/version); v_arm64=$(cat digest-arm64/version)
          echo "amd64=$v_amd64 arm64=$v_arm64"
          [[ "$v_amd64" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$v_amd64" = "$v_arm64" ]
          echo "PHP_VERSION=$v_amd64" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: env.HAS_DOCKERHUB_SECRETS == 'true'

      - uses: docker/login-action@v3
        if: env.HAS_DOCKERHUB_SECRETS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag ${{ env.IMAGE }}:latest and :<PHP version>
        if: env.HAS_DOCKERHUB_SECRETS == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$PHP_VERSION" \
            "$IMAGE@$(cat digest-amd64/digest)" "$IMAGE@$(cat digest-arm64/digest)"

      - uses: docker/setup-qemu-action@v3
        if: env.HAS_DOCKERHUB_SECRETS == 'true'

      - name: Check the published tags
        if: env.HAS_DOCKERHUB_SECRETS == 'true'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:latest"
          for tag in latest "$PHP_VERSION"; do
            for platform in linux/amd64 linux/arm64; do
              out=$(docker run --rm --pull always --quiet --platform "$platform" "$IMAGE:$tag" php -r 'echo PHP_VERSION, " ", php_uname("m");')
              echo "$tag $platform: $out"
              [ "${out%% *}" = "$PHP_VERSION" ]
            done
          done
