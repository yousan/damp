name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly rebuild so a broken upstream image or package shows up early.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # dnsmasq on 127.0.0.1:53 only; see .github/compose.ci.yml.
      COMPOSE_FILE: docker-compose.yml:.github/compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      # Create it as the runner user; otherwise Docker creates it owned by root.
      - name: Build and start
        run: |
          mkdir -p ~/public_html
          docker compose up -d --build

      - name: Smoke test
        run: bin/test.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
