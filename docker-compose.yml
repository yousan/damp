# DAMP: Apache + PHP + MariaDB + dnsmasq for http://<folder>.test/ local sites.
# Usage: docker compose up   (see README.md)

services:
  php.test:
    container_name: php.test
    restart: always
    # Pulled from Docker Hub (built by .github/workflows/docker-publish.yml for amd64/arm64).
    # To build it yourself instead: docker compose build --pull php.test
    image: yousan/php8.4-apache:latest
    build: ./php8.4/apache
    ports:
      - 80:80
    volumes:
      - ./php8.4/apache/php/user.ini:/usr/local/etc/php/conf.d/zz-user.ini:ro
      # Add symlink directories if you use symlinks at documents.
      - ~/git:/Users/yousan/git
      - ~/svn:/Users/yousan/svn
      - ~/public_html:/var/www/vhosts
    depends_on:
      - mysql.test
      - phpmyadmin.test

  phpmyadmin.test:
    container_name: phpmyadmin.test
    restart: always
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql.test
      PMA_ABSOLUTE_URI: http://pma.test/
    depends_on:
      - mysql.test

  mysql.test:
    container_name: mysql.test
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: example
    ports:
      - 3306:3306
    volumes:
      - /private/var/lib/mysql:/var/lib/mysql

  dnsmasq.test:
    container_name: dnsmasq.test
    image: yousan/dnsmasq:1.6.1
    ports:
      - 53:53/tcp
      - 53:53/udp
    cap_add:
      - NET_ADMIN
