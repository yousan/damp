; DAMP defaults, applied on top of php.ini-development.
; Put your own overrides in php8.4/apache/php/user.ini (mounted by docker-compose.yml).

; opcache: check files for changes on every request (local development)
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=0
opcache.enable_cli=1

upload_max_filesize=32M
post_max_size=48M
