# Default for requests that match no name below (e.g. http://127.0.0.1/).
# Must stay first: Apache uses the first VirtualHost as the fallback.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# phpMyAdmin (phpmyadmin.test container) at http://pma.test/
# Must come before the *.test wildcard below, which would otherwise match pma.test.
<VirtualHost *:80>
    ServerName pma.test
    ProxyPreserveHost On
    ProxyPass        / http://phpmyadmin.test/
    ProxyPassReverse / http://phpmyadmin.test/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# http://example.test/ -> /var/www/vhosts/example.test/ (~/public_html/example.test)
<VirtualHost *:80>
    ServerName vhosts.test
    ServerAlias *.test
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/vhosts/%0/
    <Directory /var/www/vhosts>
        Options All
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
