# Default (first) vhost: any hostname is served from ~/public_html/<hostname>/,
# e.g. http://example.test/ -> /var/www/vhosts/example.test/.
# It must stay first so that names other than *.test (foo.localhost, /etc/hosts entries) work too.
<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/vhosts/%0/
    <Directory /var/www/vhosts>
        Options All
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# phpMyAdmin (phpmyadmin.test container) at http://pma.test/
<VirtualHost *:80>
    ServerName pma.test
    ProxyPreserveHost On
    ProxyPass        / http://phpmyadmin.test/
    ProxyPassReverse / http://phpmyadmin.test/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
